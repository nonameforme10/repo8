<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CORE // IP_DETECTOR</title>
    <link rel="icon" href="data:,">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background-color: #0a0a0a;
            color: #e0e0e0;
            font-family: 'Consolas', 'Courier New', monospace;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }
        .terminal-card {
            background-color: #111111;
            border: 3px solid #333333;
            width: 100%;
            max-width: 500px;
            padding: 25px;
            box-shadow: 8px 8px 0px #222222;
            position: relative;
        }
        .terminal-card::before {
            content: "SYSTEM LOG // NETWORK_INSPECT";
            position: absolute;
            top: -14px;
            left: 15px;
            background: #0a0a0a;
            padding: 0 8px;
            font-size: 0.75rem;
            color: #00ff66;
            letter-spacing: 1px;
        }
        .label {
            font-size: 0.85rem;
            color: #888888;
            text-transform: uppercase;
            margin-bottom: 8px;
        }
        .ip-output {
            font-size: 2.2rem;
            font-weight: bold;
            color: #00ff66;
            word-break: break-all;
            background: #161616;
            padding: 15px;
            border: 1px dashed #333333;
            margin-bottom: 15px;
            min-height: 70px;
            display: flex;
            align-items: center;
        }
        .ip-output.error { color: #ff4444; font-size: 1.1rem; }
        .ip-output.ipv6 { font-size: 1.15rem; }
        .ip-output.muted { color: #777777; font-size: 1rem; border-style: dotted; }
        .label + .ip-output { margin-bottom: 18px; }
        .meta-grid {
            display: grid;
            grid-template-columns: auto 1fr;
            gap: 5px 15px;
            font-size: 0.8rem;
            color: #666666;
            border-top: 1px solid #222222;
            padding-top: 15px;
        }
        .meta-val { color: #aaaaaa; }
        @keyframes blink { 50% { opacity: 0.2; } }
        .cursor { animation: blink 1s step-end infinite; }
    </style>
</head>
<body>
    <div class="terminal-card">
        <div class="label">Target Origin // Inbound IPv4:</div>
        <div class="ip-output" id="ip4"><span class="cursor">RESOLVING_</span></div>

        <div class="label">Target Origin // Inbound IPv6:</div>
        <div class="ip-output ipv6" id="ip6"><span class="cursor">RESOLVING_</span></div>

        <div class="meta-grid">
            <div>SOURCE:</div><div class="meta-val">VPS // FIREBASE_RTD</div>
            <div>IPv4:</div><div class="meta-val" id="status4">QUERYING...</div>
            <div>IPv6:</div><div class="meta-val" id="status6">QUERYING...</div>
        </div>
    </div>

    <script>
        // ==== CONFIG: protocol-specific endpoints on your VPS ====
        // Each host resolves to ONLY one address family, which forces the browser to
        // connect over that protocol — the only reliable way to read both addresses.
        const ENDPOINTS = {
            v4: "https://api.hunterstar.online/api/ip",   // A record only   -> forces IPv4
            v6: "https://api6.hunterstar.online/api/ip",  // AAAA record only -> forces IPv6
        };
        // =========================================================

        function probe(url, ipEl, statusEl, kind) {
            fetch(url)
                .then((r) => {
                    if (!r.ok) throw new Error('HTTP ' + r.status);
                    return r.json();
                })
                .then((data) => {
                    ipEl.className = 'ip-output' + (kind === 'v6' ? ' ipv6' : '');
                    ipEl.textContent = data.ip;
                    statusEl.textContent = data.recordedAt
                        ? '200 OK // logged ' + new Date(data.recordedAt).toISOString()
                        : '200 OK // PACKET_CAPTURED';
                })
                .catch((err) => {
                    // No route over this family is normal (e.g. networks without IPv6).
                    ipEl.className = 'ip-output muted';
                    ipEl.textContent = kind === 'v6' ? 'NO_IPV6_ROUTE' : 'CONNECTION_FAILED';
                    statusEl.textContent = kind === 'v6'
                        ? 'unavailable on this network'
                        : 'ERR // ' + err.message;
                    console.warn('Probe failed (' + kind + '):', err.message);
                });
        }

        probe(ENDPOINTS.v4, document.getElementById('ip4'), document.getElementById('status4'), 'v4');
        probe(ENDPOINTS.v6, document.getElementById('ip6'), document.getElementById('status6'), 'v6');
    </script>
</body>
</html>
