<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CORE // IP_DETECTOR</title>
    <link rel="icon" href="data:,">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background-color: #0a0a0a;
            color: #e0e0e0;
            font-family: 'Consolas', 'Courier New', monospace;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }
        .terminal-card {
            background-color: #111111;
            border: 3px solid #333333;
            width: 100%;
            max-width: 500px;
            padding: 25px;
            box-shadow: 8px 8px 0px #222222;
            position: relative;
        }
        .terminal-card::before {
            content: "SYSTEM LOG // NETWORK_INSPECT";
            position: absolute;
            top: -14px;
            left: 15px;
            background: #0a0a0a;
            padding: 0 8px;
            font-size: 0.75rem;
            color: #00ff66;
            letter-spacing: 1px;
        }
        .label {
            font-size: 0.85rem;
            color: #888888;
            text-transform: uppercase;
            margin-bottom: 8px;
        }
        .ip-output {
            font-size: 2.2rem;
            font-weight: bold;
            color: #00ff66;
            word-break: break-all;
            background: #161616;
            padding: 15px;
            border: 1px dashed #333333;
            margin-bottom: 15px;
            min-height: 70px;
            display: flex;
            align-items: center;
        }
        .ip-output.error { color: #ff4444; font-size: 1.1rem; }
        .meta-grid {
            display: grid;
            grid-template-columns: auto 1fr;
            gap: 5px 15px;
            font-size: 0.8rem;
            color: #666666;
            border-top: 1px solid #222222;
            padding-top: 15px;
        }
        .meta-val { color: #aaaaaa; }
        @keyframes blink { 50% { opacity: 0.2; } }
        .cursor { animation: blink 1s step-end infinite; }
    </style>
</head>
<body>
    <div class="terminal-card">
        <div class="label">Target Origin Inbound IP:</div>
        <div class="ip-output" id="ip"><span class="cursor">RESOLVING_</span></div>
        <div class="meta-grid">
            <div>SOURCE:</div><div class="meta-val">VPS // FIREBASE_RTD</div>
            <div>LOGGED:</div><div class="meta-val" id="logged">—</div>
            <div>STATUS:</div><div class="meta-val" id="status">QUERYING...</div>
        </div>
    </div>

    <script>
        // ==== CONFIG: point this at your VPS (the Nginx domain that proxies port 5000) ====
        const VPS_ENDPOINT = "https://api.hunterstar.online/api/ip";
        // ==================================================================================

        const ipEl = document.getElementById('ip');
        const statusEl = document.getElementById('status');
        const loggedEl = document.getElementById('logged');

        fetch(VPS_ENDPOINT)
            .then((r) => {
                if (!r.ok) throw new Error('HTTP ' + r.status);
                return r.json();
            })
            .then((data) => {
                ipEl.textContent = data.ip;
                statusEl.textContent = '200 OK // PACKET_CAPTURED';
                loggedEl.textContent = data.recordedAt
                    ? new Date(data.recordedAt).toISOString()
                    : 'yes';
            })
            .catch((err) => {
                ipEl.classList.add('error');
                ipEl.textContent = 'CONNECTION_FAILED';
                statusEl.textContent = 'ERR // ' + err.message;
                loggedEl.textContent = 'no';
                console.error('Failed to reach VPS endpoint:', err);
            });
    </script>
</body>
</html>
